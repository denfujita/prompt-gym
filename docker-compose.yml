services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: promptgym
      POSTGRES_PASSWORD: promptgym
      POSTGRES_DB: promptgym
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptgym"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - prompt-gym-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prompt-gym-postgres:
