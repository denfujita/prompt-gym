name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://promptgym:promptgym@127.0.0.1:5432/promptgym
      POSTGRES_TEST_URL: postgres://promptgym:promptgym@127.0.0.1:5432/promptgym
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: promptgym
          POSTGRES_PASSWORD: promptgym
          POSTGRES_DB: promptgym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptgym"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run db:migrate -w @prompt-gym/db
      - run: npm test
      - run: npm run build
